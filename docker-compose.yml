version: '3.8'

services:
  # ─── Backend (FastAPI) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collegegpt-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - UPLOAD_DIRECTORY=/app/uploads
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
      - DEBUG=false
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - TOP_K_RESULTS=${TOP_K_RESULTS:-5}
    volumes:
      - chroma_data:/app/chroma_db
      - upload_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - collegegpt-network

  # ─── Frontend (React + Nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collegegpt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - collegegpt-network

# ─── Named Volumes ────────────────────────────────────────────────────────
volumes:
  chroma_data:
    name: collegegpt_chroma
  upload_data:
    name: collegegpt_uploads

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  collegegpt-network:
    name: collegegpt-net
    driver: bridge
